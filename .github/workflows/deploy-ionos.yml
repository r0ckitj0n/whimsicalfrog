name: Deploy to IONOS

# Default push-to-main mode is security-only: force-upload a short auth/session
# allowlist only. Never mirrors, never deletes, never touches images/, uploads/,
# .env, config/secret.key, private/, sessions/, backups/, or dist/.
# IONOS SFTP "mkdir: Access failed" on existing dirs is handled in
# scripts/deploy_security_only.sh (fail-exit off around mkdir only).

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: "Deploy mode (security-only keeps live precedence)"
        type: choice
        required: true
        default: security-only
        options:
          - security-only
          - lite
          - dist-only
          - env-only

concurrency:
  group: deploy-ionos-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      # environment.url cannot reference secrets (workflow parse fails with 0 jobs).
      url: https://whimsicalfrog.us
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deploy mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            MODE="security-only"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Using deploy mode: $MODE"

      - name: Setup Node
        if: steps.mode.outputs.mode != 'security-only' && steps.mode.outputs.mode != 'env-only'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Install dependencies
        if: steps.mode.outputs.mode != 'security-only' && steps.mode.outputs.mode != 'env-only'
        run: npm ci

      - name: Deploy to IONOS
        env:
          WF_DEPLOY_HOST: ${{ secrets.WF_DEPLOY_HOST }}
          WF_DEPLOY_USER: ${{ secrets.WF_DEPLOY_USER }}
          WF_DEPLOY_PASS: ${{ secrets.WF_DEPLOY_PASS }}
          DEPLOY_BASE_URL: ${{ secrets.WF_DEPLOY_BASE_URL }}
          WF_SKIP_RELEASE_BUILD: "0"
          WF_UPLOAD_MAINTENANCE: "0"
          WF_UPLOAD_LIVE_ENV: "0"
          WF_DRY_RUN: "0"
          WF_STRICT_VERIFY: "1"
          WF_UPLOAD_VENDOR: "0"
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          case "$MODE" in
            security-only) bash scripts/deploy.sh --security-only ;;
            lite) bash scripts/deploy.sh --lite ;;
            dist-only) bash scripts/deploy.sh --dist-only ;;
            env-only) bash scripts/deploy.sh --env-only ;;
            *)
              echo "Unknown mode: $MODE" >&2
              exit 2
              ;;
          esac

      - name: Kill Switch Verify Live Build
        if: steps.mode.outputs.mode != 'security-only' && steps.mode.outputs.mode != 'env-only'
        env:
          BASE_URL: ${{ secrets.WF_DEPLOY_BASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${BASE_URL:-}" ]; then
            echo "[kill-switch] ERROR: WF_DEPLOY_BASE_URL secret is required"
            exit 1
          fi

          echo "[kill-switch] Checking homepage and manifest at $BASE_URL"
          HTTP_MANIFEST_CODE="$(curl -sS -o /dev/null -w "%{http_code}" "$BASE_URL/dist/.vite/manifest.json")"
          if [ "$HTTP_MANIFEST_CODE" != "200" ]; then
            echo "[kill-switch] ERROR: manifest returned HTTP $HTTP_MANIFEST_CODE"
            exit 1
          fi

          HOME_HTML="$(curl -sS "$BASE_URL/")"
          # index.html keeps a local-dev fallback string "/src/entries/main.tsx" in JS.
          # Only fail if a real script tag loads /src/ (broken production boot).
          if echo "$HOME_HTML" | grep -Eiq '<script[^>]+src=["'\'']/src/'; then
            echo "[kill-switch] ERROR: homepage loads a /src/ script tag"
            exit 1
          fi

          echo "[kill-switch] OK: manifest is 200 and homepage does not load /src/ scripts."

      - name: Verify security endpoints
        if: steps.mode.outputs.mode == 'security-only'
        env:
          BASE_URL: ${{ secrets.WF_DEPLOY_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL:-}" ]; then
            echo "[security-check] ERROR: WF_DEPLOY_BASE_URL secret is required"
            exit 1
          fi
          CODE="$(curl -sS -o /dev/null -w "%{http_code}" "$BASE_URL/api/whoami.php")"
          echo "[security-check] /api/whoami.php -> HTTP $CODE"
          case "$CODE" in
            200|401|403) echo "[security-check] OK" ;;
            *) echo "[security-check] Unexpected status $CODE"; exit 1 ;;
          esac
