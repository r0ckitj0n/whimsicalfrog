name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine commit range
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "GITLEAKS_COMMIT_RANGE=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            echo "GITLEAKS_COMMIT_RANGE=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_ENV"
          else
            echo "GITLEAKS_COMMIT_RANGE=${{ github.sha }}" >> "$GITHUB_ENV"
          fi

      - name: Run gitleaks
        run: bash scripts/security/run_gitleaks.sh history
