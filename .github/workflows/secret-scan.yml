name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1
            export GITLEAKS_COMMIT_RANGE="origin/${{ github.base_ref }}..HEAD"
            bash scripts/security/run_gitleaks.sh history
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            export GITLEAKS_COMMIT_RANGE="${{ github.event.before }}..HEAD"
            bash scripts/security/run_gitleaks.sh history
          else
            bash scripts/security/run_gitleaks.sh repo
          fi
