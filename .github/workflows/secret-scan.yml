name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ]; then
            git fetch --no-tags origin "$PR_BASE_SHA" --depth=1
            bash scripts/security/run_gitleaks.sh history "$PR_BASE_SHA..HEAD"
          elif [ -n "$PUSH_BEFORE_SHA" ] && ! printf '%s' "$PUSH_BEFORE_SHA" | grep -q '^0*$'; then
            git fetch --no-tags origin "$PUSH_BEFORE_SHA" --depth=1 || true
            bash scripts/security/run_gitleaks.sh history "$PUSH_BEFORE_SHA..HEAD"
          else
            bash scripts/security/run_gitleaks.sh history "--all"
          fi
